name: Build

on:
   workflow_dispatch:
   push:
      tags: ["v*"]

jobs:
   build:
      strategy:
         matrix:
            os: [windows-latest, macos-latest, ubuntu-latest]
      runs-on: ${{ matrix.os }}
      timeout-minutes: 30
      steps:
         - uses: actions/checkout@v4
         - uses: oven-sh/setup-bun@v2
           with:
              bun-version: 1.3.10
         - run: bun install --frozen-lockfile
         - run: bun run dist
         - uses: actions/upload-artifact@v4
           with:
              name: image-deduplicator-${{ matrix.os }}
              path: |
                 release/*.exe
                 release/*.dmg
                 release/*.AppImage
              if-no-files-found: error
