name: Verify

on:
   workflow_call:
      inputs:
         tag_check:
            description: Fail when the pushed tag does not match package.json's version.
            type: boolean
            default: false

permissions:
   contents: read

jobs:
   verify:
      name: Verify
      runs-on: windows-latest
      timeout-minutes: 30
      steps:
         - uses: actions/checkout@v7
         - uses: oven-sh/setup-bun@v2
           with:
              bun-version: latest
         - name: Cache Electron downloads
           uses: actions/cache@v6
           with:
              path: ${{ runner.temp }}/electron-cache
              key: verify-electron-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bun.lock') }}
              restore-keys: verify-electron-${{ runner.os }}-${{ runner.arch }}-
         - run: bun install --frozen-lockfile
           env:
              ELECTRON_CACHE: ${{ runner.temp }}/electron-cache
         - name: Verify tag matches package version
           if: inputs.tag_check && startsWith(github.ref, 'refs/tags/')
           run: |
              $tag = $env:GITHUB_REF_NAME.Substring(1)
              $version = node -p "require('./package.json').version"
              if ($tag -ne $version) {
                 Write-Error "Tag ($env:GITHUB_REF_NAME) does not match package.json version ($version)."
                 exit 1
              }
         - run: bun run verify
         - name: Upload UI smoke screenshots
           if: failure()
           uses: actions/upload-artifact@v7
           with:
              name: ui-smoke-verify-${{ github.run_id }}
              path: .cache/ui-smoke/
              if-no-files-found: ignore
              retention-days: 14
