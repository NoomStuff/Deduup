name: Verify

on:
   push:
   pull_request:

jobs:
   verify:
      runs-on: windows-latest
      timeout-minutes: 30
      steps:
         - uses: actions/checkout@v4
         - uses: oven-sh/setup-bun@v2
           with:
              bun-version: 1.3.10
         - run: bun install --frozen-lockfile
         - run: bun run format:check
         - run: bun run lint
         - run: bun run test
         - run: bun run test:ui
         - uses: actions/upload-artifact@v4
           if: failure()
           with:
              name: ui-smoke-artifacts
              path: .cache/ui-smoke
