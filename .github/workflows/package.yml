name: Package

on:
   workflow_call:

permissions:
   contents: read

jobs:
   build:
      name: Build ${{ matrix.target }}
      strategy:
         fail-fast: false
         matrix:
            include:
               - { os: windows-latest, target: win-x64 }
               - { os: macos-15-intel, target: mac-x64 }
               - { os: macos-15, target: mac-arm64 }
               - { os: ubuntu-24.04, target: linux-x64 }
               - { os: ubuntu-24.04-arm, target: linux-arm64 }
      runs-on: ${{ matrix.os }}
      timeout-minutes: 45
      steps:
         - uses: actions/checkout@v7
         - uses: oven-sh/setup-bun@v2
           with:
              bun-version: latest
         - uses: actions/cache@v6
           with:
              path: |
                 ${{ runner.temp }}/electron-cache
                 ${{ runner.temp }}/electron-builder-cache
              key: electron-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bun.lock') }}
              restore-keys: electron-${{ runner.os }}-${{ runner.arch }}-
         - run: bun install --frozen-lockfile
           env:
              ELECTRON_CACHE: ${{ runner.temp }}/electron-cache
              ELECTRON_BUILDER_CACHE: ${{ runner.temp }}/electron-builder-cache
         - name: Package
           run: ${{ runner.os == 'Windows' && 'bun run dist:win:all' || runner.os == 'macOS' && 'bun run dist:mac' || 'bun run dist:linux' }}
           env:
              CSC_IDENTITY_AUTO_DISCOVERY: false
              ELECTRON_CACHE: ${{ runner.temp }}/electron-cache
              ELECTRON_BUILDER_CACHE: ${{ runner.temp }}/electron-builder-cache
         # Keep the exact candidate binaries if a later verification step flakes.
         # The release job still requires every package job to succeed.
         - name: Upload artifacts
           uses: actions/upload-artifact@v7
           with:
              name: dist-${{ matrix.target }}
              path: |
                 release/Deduup-*.exe
                 release/Deduup-*.dmg
                 release/Deduup-*.AppImage
                 release/latest*.yml
                 !release/latest-mac.yml
              if-no-files-found: error
              overwrite: true
         - name: Verify the packaged app
           run: ${{ runner.os == 'Linux' && 'xvfb-run -a node scripts/verify-package.mjs' || 'node scripts/verify-package.mjs' }}
         - name: Upload failure diagnostics
           if: failure()
           uses: actions/upload-artifact@v7
           with:
              name: diagnostics-${{ matrix.target }}
              path: |
                 release/builder-debug.yml
                 release/builder-effective-config.yaml
              if-no-files-found: ignore
              retention-days: 14
              overwrite: true
