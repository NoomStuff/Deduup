name: Release

on:
   workflow_dispatch:
   push:
      branches:
         - main
      tags:
         - "v*"

permissions:
   contents: read

# A newer main commit supersedes the older run. Publication keeps the release a
# private draft until it completes, so an interrupted run is safe to retry.
concurrency:
   group: release
   cancel-in-progress: ${{ github.ref == 'refs/heads/main' }}

jobs:
   prepare:
      name: Select release and tag version changes
      runs-on: ubuntu-latest
      timeout-minutes: 5
      permissions:
         contents: write
      outputs:
         build: ${{ steps.release.outputs.build }}
         tag: ${{ steps.release.outputs.tag }}
         candidate: ${{ steps.release.outputs.candidate }}
      steps:
         - uses: actions/github-script@v9
           id: release
           with:
              script: |
                 const { owner, repo } = context.repo;
                 if (context.eventName === 'workflow_dispatch') {
                   core.setOutput('build', 'true');
                   return;
                 }
                 if (context.ref.startsWith('refs/tags/')) {
                   core.setOutput('build', 'true');
                   core.setOutput('tag', context.ref.slice('refs/tags/'.length));
                   return;
                 }
                 // A push to main releases when package.json's version changed;
                 // the tag itself is created only after every package passed verification.
                 const versionAt = async (ref) => {
                   const { data } = await github.rest.repos.getContent({ owner, repo, path: 'package.json', ref });
                   return JSON.parse(Buffer.from(data.content, 'base64').toString('utf8')).version;
                 };
                 const version = await versionAt(context.sha);
                 const before = context.payload.before;
                 const previous = /^0+$/.test(before) ? undefined : await versionAt(before);
                 if (typeof version !== 'string' || !/^\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?(?:\+[0-9A-Za-z.-]+)?$/.test(version)) {
                   throw new Error(`Invalid package version: ${version}`);
                 }
                 const tag = `v${version}`;
                 let existing;
                 try {
                   existing = (await github.rest.git.getRef({ owner, repo, ref: `tags/${tag}` })).data;
                 } catch (error) {
                   if (error.status !== 404) throw error;
                 }
                 if (version === previous && existing) {
                   // Every main push still packages and verifies all five targets as a candidate.
                   core.info(`Version remains ${version} and ${tag} already exists. Verifying this commit as a candidate.`);
                   core.setOutput('build', 'true');
                   core.setOutput('candidate', 'true');
                   return;
                 }
                 if (existing) {
                   const commit = (await github.rest.repos.getCommit({ owner, repo, ref: `refs/tags/${tag}` })).data;
                   if (commit.sha !== context.sha) throw new Error(`${tag} already points to another commit. Choose a new version.`);
                   core.info(`${tag} already points to this commit.`);
                 } else {
                   core.info(`${tag} will be created after every package passes verification.`);
                 }
                 core.setOutput('build', 'true');
                 core.setOutput('tag', tag);

   checks:
      name: Checks
      needs: prepare
      uses: ./.github/workflows/verify.yml
      with:
         tag_check: true

   build:
      needs: prepare
      if: needs.prepare.outputs.build == 'true'
      uses: ./.github/workflows/package.yml

   candidate:
      name: Report candidate
      if: always() && needs.prepare.outputs.candidate == 'true'
      needs: [prepare, checks, build]
      permissions:
         statuses: write
      runs-on: ubuntu-latest
      timeout-minutes: 5
      steps:
         - uses: actions/github-script@v9
           env:
              PASSED: ${{ needs.checks.result == 'success' && needs.build.result == 'success' }}
           with:
              script: |
                 const passed = process.env.PASSED === 'true';
                 await github.rest.repos.createCommitStatus({
                   ...context.repo, sha: context.sha, state: passed ? 'success' : 'failure', context: 'Release candidate',
                   description: passed ? 'All five packages verified' : 'Candidate verification failed',
                   target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
                 });

   release:
      name: Publish release
      if: needs.prepare.outputs.tag != '' && needs.checks.result == 'success' && needs.build.result == 'success'
      needs: [prepare, checks, build]
      permissions:
         contents: write
      runs-on: ubuntu-latest
      timeout-minutes: 10
      steps:
         - uses: actions/checkout@v7
         - uses: oven-sh/setup-bun@v2
           with:
              bun-version: "1.4.2"
         - uses: actions/download-artifact@v8
           with:
              pattern: dist-*
              merge-multiple: true
              path: dist
         - name: Prepare update feeds
           env:
              RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
           run: bun scripts/prepare-update-feed.mjs dist dist/feed "$RELEASE_TAG"
         - name: Select exact app downloads and feeds
           env:
              RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
           run: bun scripts/release-downloads.mjs dist dist/feed dist/release "$RELEASE_TAG"
         - name: Create draft release
           env:
              GH_TOKEN: ${{ github.token }}
              GH_REPO: ${{ github.repository }}
              RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
           run: |
              shopt -s nullglob
              assets=(dist/release/*)
              if [ "${#assets[@]}" -ne 10 ]; then
                echo "Expected seven downloads and three updater feeds, found ${#assets[@]}." >&2
                exit 1
              fi
              case "${RELEASE_TAG#v}" in
                *-*) flags="--prerelease" ;;
                *) flags="" ;;
              esac
              if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
                if [ "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" = true ]; then
                  gh release upload "$RELEASE_TAG" "${assets[@]}" --clobber
                fi
              else
                gh release create "$RELEASE_TAG" "${assets[@]}" --draft                   --title "Deduup ${RELEASE_TAG#v}"                   --target "$GITHUB_SHA" --notes "" $flags
              fi
         - name: Publish release
           env:
              GH_TOKEN: ${{ github.token }}
              GH_REPO: ${{ github.repository }}
              RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
           run: gh release edit "$RELEASE_TAG" --draft=false
